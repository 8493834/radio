<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24/7 Live Radio & DJ Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-6 py-4 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="inline-block w-3 h-3 bg-red-500 rounded-full animate-ping"></span>
        <h1 class="text-xl font-bold tracking-wide">AIR-WAVE <span class="text-indigo-400">24/7 STREAM</span></h1>
      </div>
      
      <button id="openAdminBtn" class="text-xs bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 px-3 py-1.5 rounded-lg transition font-medium">
        🎛️ Station Console
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full p-6 grid grid-cols-1 md:grid-cols-3 gap-6 my-auto">
    
    <!-- Player Engine -->
    <div class="md:col-span-2 bg-slate-800 border border-slate-700/60 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
      <div class="flex flex-col items-center text-center space-y-4 my-6">
        <div class="relative w-48 h-48 rounded-2xl bg-slate-700 border-2 border-slate-600 overflow-hidden shadow-2xl">
          <img id="albumArt" src="https://8493834.github.io/sps/icon-192.png" alt="Album Art" class="w-full h-full object-cover">
        </div>

        <div>
          <h2 id="nowPlayingTitle" class="text-2xl font-bold text-white tracking-tight">Snail Radio 24/7</h2>
          <p id="nowPlayingArtist" class="text-slate-400 font-medium">Loading Track Info...</p>
        </div>
      </div>

      <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700/50 flex flex-col gap-3">
        <!-- Live Audio Stream Direct Source -->
        <audio id="radioPlayer" class="w-full rounded-lg" controls preload="none">
          <source src="https://overcoat-barista-tactical.ngrok-free.dev/stream" type="audio/mpeg" />
          Your browser does not support live streams.
        </audio>
        <div class="flex justify-between items-center text-xs text-slate-400 px-1">
          <span>Broadcast Status: <strong id="streamStatus" class="text-green-400">24/7 Live</strong></span>
          <span class="text-indigo-400 font-mono">128 kbps MP3</span>
        </div>
      </div>
    </div>

    <!-- Song Request & Ad Status Box -->
    <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
      <div>
        <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">🎵 Request a Song / Message DJ</h3>
        <div id="requestLog" class="h-48 overflow-y-auto space-y-2 text-xs text-slate-300 pr-1">
          <p class="text-slate-500 italic">No recent requests.</p>
        </div>
      </div>

      <form id="requestForm" class="mt-4 flex flex-col gap-2">
        <input id="requestInput" type="text" placeholder="Song title or shoutout..." required
          class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-xs transition">
          Send Request
        </button>
      </form>
    </div>

  </main>

  <!-- DJ Admin Modal -->
  <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 relative shadow-2xl">
      <button id="closeAdminBtn" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>

      <!-- Auth Form -->
      <div id="loginView" class="space-y-4">
        <h3 class="text-lg font-bold text-white">Station Admin Login</h3>
        <form id="loginForm" class="space-y-3">
          <input id="adminEmail" type="email" placeholder="Email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
          <input id="adminPass" type="password" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs py-2.5 rounded-lg font-medium">Log In</button>
        </form>
      </div>

      <!-- Station Control Dashboard -->
      <div id="dashboardView" class="space-y-6 hidden">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
          <h3 class="text-lg font-bold text-white">🎧 DJ & Ad Control Panel</h3>
          <button id="logoutBtn" class="text-xs text-red-400 hover:underline">Log Out</button>
        </div>

        <!-- Metadata Manager -->
        <form id="updateTrackForm" class="space-y-3">
          <h4 class="text-xs font-semibold text-indigo-400 uppercase">Override Live Track Info</h4>
          <input id="inputTitle" type="text" placeholder="Current Song Title" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white" required>
          <input id="inputArtist" type="text" placeholder="Artist / Show Name" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white" required>
          <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white text-xs py-2 rounded-lg font-medium">Push Metadata Update</button>
        </form>

        <!-- Live Requests Queue -->
        <div class="space-y-2">
          <h4 class="text-xs font-semibold text-indigo-400 uppercase">Incoming Song Requests</h4>
          <div id="adminRequestsList" class="max-h-32 overflow-y-auto space-y-2 text-xs"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBUxmzFjjGIfTx_V9B0u3E5pr5dmBc4IZk",
      authDomain: "snail-protective-services.firebaseapp.com",
      projectId: "snail-protective-services",
      storageBucket: "snail-protective-services.firebasestorage.app",
      messagingSenderId: "149782048453",
      appId: "1:149782048453:web:eff4039f4c0f2fa5004aac"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // UI Elements
    const adminModal = document.getElementById('adminModal');
    const radioPlayer = document.getElementById('radioPlayer');
    const streamStatus = document.getElementById('streamStatus');

    document.getElementById('openAdminBtn').onclick = () => adminModal.classList.remove('hidden');
    document.getElementById('closeAdminBtn').onclick = () => adminModal.classList.add('hidden');

    // Auth state management
    auth.onAuthStateChanged(user => {
      document.getElementById('loginView').classList.toggle('hidden', !!user);
      document.getElementById('dashboardView').classList.toggle('hidden', !user);
    });

    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      auth.signInWithEmailAndPassword(
        document.getElementById('adminEmail').value,
        document.getElementById('adminPass').value
      ).catch(err => alert(err.message));
    };

    document.getElementById('logoutBtn').onclick = () => auth.signOut();

    // DJ Pushing New Track Metadata
    document.getElementById('updateTrackForm').onsubmit = (e) => {
      e.preventDefault();
      const title = document.getElementById('inputTitle').value;
      const artist = document.getElementById('inputArtist').value;

      db.ref('nowPlaying').set({
        title: title,
        artist: artist,
        updatedAt: Date.now()
      }).then(() => {
        alert('Metadata updated across all listener clients!');
      });
    };

    // Live Sync Now Playing metadata for listeners
    db.ref('nowPlaying').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('nowPlayingTitle').textContent = data.title || "24/7 Live Stream";
        document.getElementById('nowPlayingArtist').textContent = data.artist || "Snail Radio";
      }
    });

    // Handle Song Requests
    document.getElementById('requestForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('requestInput');
      if (!input.value.trim()) return;
      
      db.ref('requests').push({ text: input.value, timestamp: Date.now() });
      input.value = "";
    };

    db.ref('requests').limitToLast(10).on('value', (snapshot) => {
      const requestLog = document.getElementById('requestLog');
      const adminList = document.getElementById('adminRequestsList');
      requestLog.innerHTML = "";
      adminList.innerHTML = "";

      if (!snapshot.exists()) {
        requestLog.innerHTML = '<p class="text-slate-500 italic">No recent requests.</p>';
        return;
      }

      snapshot.forEach(child => {
        const data = child.val();
        
        // Listener View
        const p = document.createElement('p');
        p.className = "bg-slate-900/60 p-2 rounded border border-slate-700/40";
        p.textContent = `🎵 ${data.text}`;
        requestLog.appendChild(p);

        // Admin View
        const item = document.createElement('div');
        item.className = "bg-slate-900 p-2 rounded flex justify-between items-center border border-slate-700";
        item.innerHTML = `<span>${data.text}</span><button onclick="firebase.database().ref('requests/${child.key}').remove()" class="text-red-400 text-xs hover:underline">Dismiss</button>`;
        adminList.appendChild(item);
      });
    });

    // Stream status indicator
    radioPlayer.onplaying = () => {
      streamStatus.textContent = "Live Broadcast";
      streamStatus.className = "text-green-400 font-bold";
    };
    radioPlayer.onwaiting = () => {
      streamStatus.textContent = "Buffering...";
      streamStatus.className = "text-yellow-400 font-bold";
    };
    radioPlayer.onpause = () => {
      streamStatus.textContent = "Paused";
      streamStatus.className = "text-slate-400";
    };
  </script>
</body>
</html>
